<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cut sheet</title>
  <style>
    @page { size: letter; margin: 0.4in; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Georgia, serif; color: #3a2418; }
    .no-print { padding: 12px 16px; }
    .sheet { width: 8.5in; min-height: 11in; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 3.2in); }
    .cell { border: 1px dashed #8a5a28; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; }
    .n { font-size: 22px; margin: 6px 0 0; }
    .w { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #6b5b4e; }
    @media print { .no-print { display: none !important; } .sheet { width: auto; min-height: 0; } }
  </style>
</head>
<body>
  <div class="no-print">
    <p>Print this page. Cut on the dashed lines.</p>
    <p>1 start · 2 cookies · 3 game room · 4 bedroom · 5 last · sorry page</p>
    <p><button onclick="window.print()">Print</button></p>
  </div>
  <div class="sheet" id="sheet"></div>
  <script src="clues.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const H = window.HUNT;
    const base = H.baseUrl.endsWith("/") ? H.baseUrl : H.baseUrl + "/";
    const cards = [
      { n: "1", w: "Start", url: base + "?s=1" },
      { n: "2", w: "Cookies", url: base + "?s=2" },
      { n: "3", w: "Game room", url: base + "?s=3" },
      { n: "4", w: "Bedroom", url: base + "?s=4" },
      { n: "5", w: "Last", url: base + "?s=5" },
      { n: "S", w: "I'm sorry", url: base + "sorry.html" }
    ];
    const sheet = document.getElementById("sheet");
    cards.forEach((c, i) => {
      const id = "q" + i;
      sheet.insertAdjacentHTML("beforeend", `<div class="cell"><div id="${id}"></div><div class="n">${c.n}</div><div class="w">${c.w}</div></div>`);
      new QRCode(document.getElementById(id), { text: c.url, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
    });
  </script>
</body>
</html>

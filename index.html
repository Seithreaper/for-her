<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a120c" />
  <meta name="robots" content="noindex,nofollow" />
  <title>A map for Angela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap" id="app"></main>
  <script src="clues.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const n = parseInt(params.get("s") || "0", 10);
    const H = window.HUNT;
    const t = (es, en) => (H.language === "en" ? en : es);
    const total = (H.stops || []).length;
    function mark() {
      return `<div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="22" stroke="currentColor" stroke-width="1.4" opacity="0.85"/><circle cx="32" cy="32" r="6" stroke="currentColor" stroke-width="1.2"/><path d="M32 8v8M32 48v8M8 32h8M48 32h8" stroke="currentColor" stroke-width="1.4"/><path d="M32 18l3.2 10.4L46 32l-10.8 3.6L32 46l-3.2-10.4L18 32l10.8-3.6z" fill="currentColor"/></svg></div>`;
    }
    function renderCover() {
      document.getElementById("app").innerHTML = `${mark()}<p class="kicker">${H.fromName} · September 19</p><h1>${H.title}</h1><div class="rule"></div><p class="sub">${H.subtitle}</p><section class="card cover"><p>This map only opens from the codes. The first one is passed from his phone to yours.</p></section><div class="seal">XII<br/>years</div><p class="foot">${H.herName}</p>`;
    }
    function renderStop(stop) {
      const isFinal = !!stop.final;
      const locked = isFinal && H.finalUnlock && H.finalUnlock.trim() !== "";
      const img = stop.image ? `<div class="media"><img alt="" src="${stop.image}" /></div>` : "";
      const gallery = (stop.images || []).filter(Boolean).map((src) => `<img alt="" src="${src}" />`).join("");
      const video = stop.video ? `<div class="media"><video controls playsinline src="${stop.video}"></video></div>` : "";
      const hint = stop.hint ? `<div class="hint-wrap"><button type="button" id="hintBtn">A quieter hint</button><p class="hint" id="hintText">${stop.hint}</p></div>` : "";
      const body = isFinal
        ? `<div id="finalBox" ${locked ? "hidden" : ""}><div class="letter">${escapeHtml(stop.letter || "")}</div>${gallery ? `<div class="gallery">${gallery}</div>` : ""}${video}</div>${locked ? `<div id="lockBox"><p class="sub">Eight digits. The day the map began.</p><div class="unlock"><input id="unlockIn" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="MMDDYYYY" /><button type="button" id="unlockBtn">Break the seal</button></div><p class="err" id="unlockErr" hidden>Not that date.</p></div>` : ""}`
        : `<p class="clue">${escapeHtml(stop.clue || "")}</p>${img}${video}${hint}`;
      const label = isFinal ? "X marks the spot" : `Chart ${roman(stop.n)} of ${roman(total)}`;
      document.getElementById("app").innerHTML = `${mark()}<p class="kicker">${label}</p><h2>${escapeHtml(stop.title || "")}</h2><div class="rule"></div><section class="card">${body}</section><p class="foot">${H.fromName} · Angela</p>`;
      const hb = document.getElementById("hintBtn");
      if (hb) hb.addEventListener("click", () => document.getElementById("hintText").classList.add("show"));
      const ub = document.getElementById("unlockBtn");
      if (ub) ub.addEventListener("click", tryUnlock);
      const inp = document.getElementById("unlockIn");
      if (inp) inp.addEventListener("keydown", (e) => { if (e.key === "Enter") tryUnlock(); });
    }
    function tryUnlock() {
      const val = (document.getElementById("unlockIn").value || "").replace(/\D/g, "");
      const want = H.finalUnlock.replace(/\D/g, "");
      if (val === want) { document.getElementById("lockBox").hidden = true; document.getElementById("finalBox").hidden = false; }
      else { document.getElementById("unlockErr").hidden = false; }
    }
    function roman(n) { return ({1:"I",2:"II",3:"III",4:"IV",5:"V"})[n] || String(n); }
    function escapeHtml(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    const stop = (H.stops || []).find((x) => x.n === n);
    if (!stop) renderCover(); else renderStop(stop);
  </script>
</body>
</html>

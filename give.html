<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#140e10" />
  <title>Give her clue 1</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="wrap">
    <p class="kicker">Your phone only</p>
    <h2>Clue 1 transfer</h2>
    <div class="rule"></div>
    <section class="card" style="text-align:center">
      <p class="sub">Hold both iPhones together. AirDrop the link, or let her camera scan this QR.</p>
      <div id="qr" style="display:flex;justify-content:center;margin:1.1rem 0;background:#fff;border-radius:12px;padding:12px"></div>
      <p id="url" style="word-break:break-all;color:var(--muted);font-size:0.85rem"></p>
      <p style="margin-top:1rem">
        <button type="button" id="share">AirDrop / Share</button>
        <button type="button" id="copy">Copy link</button>
      </p>
      <p class="hint show" style="margin-top:1rem">
        AirDrop: Share → Angela → AirDrop.<br />
        Or open Camera on her phone and point it at this screen.
      </p>
    </section>
  </main>
  <script src="clues.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const H = window.HUNT;
    const base = H.baseUrl.endsWith("/") ? H.baseUrl : H.baseUrl + "/";
    const url = base + "?s=1";
    document.getElementById("url").textContent = url;
    new QRCode(document.getElementById("qr"), {
      text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M
    });
    document.getElementById("copy").onclick = async () => {
      await navigator.clipboard.writeText(url);
      document.getElementById("copy").textContent = "Copied";
    };
    document.getElementById("share").onclick = async () => {
      if (navigator.share) {
        await navigator.share({ title: H.title, url });
      } else {
        await navigator.clipboard.writeText(url);
      }
    };
  </script>
</body>
</html>
